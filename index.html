<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Юбилей Константина — 30 лет</title>
    
    <link rel="apple-touch-icon" sizes="180x180" href="media/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="media/favicon-32x32.png" />
    <link rel="manifest" href="media/site.webmanifest" />

    <meta property="og:title" content="Юбилей Константина — 30 лет" />
    <meta property="og:description" content="Приглашение на праздник" />
    <meta property="og:image" content="media/og-image.jpg" />
    <meta property="og:url" content="https://vangoshh.github.io/birthdayInvitation" />

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400;500&display=swap');

      :root {
        --bg-color: #f7f5f0;
        --text-dark: #4a2e2b;
        --text-light: #8b7368;
        --border-color: #dcd5c8;
        --font-serif: 'Cormorant Garamond', 'Georgia', serif;
        --font-sans: 'Montserrat', 'Arial', sans-serif;
      }

      * { box-sizing: border-box; }

      body {
        background-color: var(--bg-color);
        color: var(--text-dark);
        font-family: var(--font-sans);
        margin: 0;
        padding: 0;
        line-height: 1.6;
      }

      .container {
        max-width: 800px;
        margin: 0 auto;
        padding: 40px 20px;
      }

      header {
        text-align: center;
        /* Убрали жесткий отступ снизу, чтобы карточка прижалась к сердечку */
        margin-bottom: 20px; 
      }

      header h1 {
        font-family: var(--font-serif);
        font-size: 38px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 3px;
        margin-top: 0;
        margin-bottom: 0; 
        line-height: 1.2;
      }

      /* --- БЛОК С ЦИФРАМИ И ФОТО --- */
      .numbers-container {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 10px; 
        /* СВЕРХУ 30px, СНИЗУ 0 */
        margin: 30px auto 15px auto; 
      }

      .number-box {
        position: relative;
        width: 180px;
        height: 280px;
      }

      /* Фотографии, которые лежат под цифрами */
      .number-box img.photo {
        width: 100%;
        height: 100%;
        object-fit: cover;
        position: absolute;
        top: 0;
        left: 0;
        z-index: 1;
        border-radius: 15px;
      }

      /* Настройки кадрирования фото */
      .box-3 img.photo {
        object-position: 50% 30%;
      }
      .box-0 img.photo {
        object-position: 50% 20%;
      }

      /* Вырезанные цифры */
      .number-box img.mask {
        width: 100%;
        height: 100%;
        position: absolute;
        top: 0;
        left: 0;
        z-index: 2;
        pointer-events: none;
        object-fit: contain;
      }

      /* --- ОСТАЛЬНЫЕ СТИЛИ --- */
      .header-divider {
        display: flex;
        align-items: center;
        justify-content: center;
        /* УБРАЛИ ВСЕ ОТСТУПЫ, ЧТОБЫ СЕРДЕЧКО ПРИЖАЛОСЬ К ЦИФРАМ */
        margin: 0; 
      }
      
      .header-divider::before,
      .header-divider::after {
        content: "";
        display: block;
        width: 80px;
        height: 1px;
        background-color: var(--border-color);
        margin: 0 15px;
      }

      .header-divider span { font-size: 24px; color: var(--text-light); }

      .card {
        background-color: #fff;
        border: 1px solid var(--border-color);
        border-radius: 4px;
        padding: 40px 30px;
        margin-bottom: 30px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.02);
      }

      .card h2, .card h3 {
        font-family: var(--font-serif);
        font-size: 28px;
        font-weight: 400;
        text-align: center;
        text-transform: uppercase;
        letter-spacing: 2px;
        margin-top: 0;
        margin-bottom: 30px;
      }

      .details-grid {
        display: flex;
        justify-content: center;
        align-items: stretch;
        margin-bottom: 30px;
      }

      .details-item {
        flex: 1;
        text-align: center;
        padding: 0 15px;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }

      .details-item:not(:last-child) {
        border-right: 1px solid var(--border-color);
      }

      .details-item .main-text {
        font-family: var(--font-serif);
        font-size: 24px;
        margin-bottom: 5px;
      }

      .details-item .sub-text {
        font-size: 14px;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: var(--text-light);
      }

      .dress-code {
        text-align: center;
        font-size: 14px;
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-top: 30px;
        padding-top: 30px;
        border-top: 1px solid var(--border-color);
      }
      
      .dress-code span {
        display: block;
        font-family: var(--font-serif);
        font-size: 26px;
        font-style: italic;
        text-transform: lowercase;
        margin-top: 5px;
        color: var(--text-dark);
      }

      .map-wrapper iframe {
        width: 100%;
        height: 350px;
        border: 1px solid var(--border-color) !important;
        border-radius: 4px;
        filter: grayscale(30%) sepia(10%);
        transition: filter 0.3s ease;
      }

      .map-wrapper iframe:hover {
        filter: grayscale(0%) sepia(0%);
      }

      .map-buttons {
        display: flex;
        justify-content: center;
        gap: 15px;
        margin-top: 20px;
      }

      .btn {
        display: inline-block;
        background-color: transparent;
        color: var(--text-dark);
        border: 1px solid var(--text-dark);
        padding: 12px 25px;
        font-family: var(--font-sans);
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 1px;
        text-decoration: none;
        cursor: pointer;
        transition: all 0.3s ease;
        text-align: center;
      }

      .btn:hover {
        background-color: var(--text-dark);
        color: var(--bg-color);
      }

      button[type="submit"] {
        width: 100%;
        background-color: var(--text-dark);
        color: #fff;
        border: none;
        padding: 15px;
        font-family: var(--font-sans);
        font-size: 14px;
        text-transform: uppercase;
        letter-spacing: 2px;
        cursor: pointer;
        transition: background-color 0.3s ease;
        margin-top: 20px;
      }

      button[type="submit"]:hover {
        background-color: #3a211f;
      }

      .form-group {
        margin-bottom: 25px;
      }

      .form-group label {
        display: block;
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-bottom: 10px;
        color: var(--text-light);
      }

      .form-group input[type="text"],
      .form-group input[type="number"],
      .form-group textarea {
        width: 100%;
        padding: 12px 15px;
        border: 1px solid var(--border-color);
        background-color: var(--bg-color);
        font-family: var(--font-sans);
        font-size: 15px;
        color: var(--text-dark);
        outline: none;
        transition: border-color 0.3s;
      }

      .form-group input:focus,
      .form-group textarea:focus {
        border-color: var(--text-light);
      }

      .radio-options {
        display: flex;
        gap: 20px;
      }

      .radio-option {
        display: flex;
        align-items: center;
        gap: 8px;
        cursor: pointer;
      }
      
      .radio-option input[type="radio"] {
        accent-color: var(--text-dark);
        width: 16px;
        height: 16px;
      }

      .success-message {
        text-align: center;
        font-family: var(--font-serif);
        font-size: 20px;
        color: var(--text-dark);
        padding: 20px;
        background-color: #f0ece1;
        border: 1px solid var(--border-color);
      }

      @media (max-width: 600px) {
        header h1 { font-size: 28px; }
        
        .numbers-container { gap: 5px; margin: 20px auto 0 auto; }
        .number-box { width: 130px; height: 200px; }

        .details-grid {
          flex-direction: column;
          gap: 20px;
        }
        .details-item:not(:last-child) {
          border-right: none;
          border-bottom: 1px solid var(--border-color);
          padding-bottom: 20px;
        }
        .map-buttons { flex-direction: column; }
        .radio-options { flex-direction: column; gap: 10px; }
        .card { padding: 30px 20px; }
      }
    </style>
  </head>
  <body>
    <div class="container">
      
      <header>
        <h1>Юбилей<br>Константина</h1>
        
        <!-- БЛОК С НАЛОЖЕНИЕМ ФОТО И ЦИФР -->
        <div class="numbers-container">
          
          <!-- Цифра 3 -->
          <div class="number-box box-3">
            <img src="media/33.PNG" alt="" class="mask" />
          </div>
          
          <!-- Цифра 0 -->
          <div class="number-box box-0">
            <img src="media/000.PNG" alt="" class="mask" />
          </div>

        </div>

        <div class="header-divider"><span>🤍</span></div>
      </header>

      <div class="card">
        <h2>Детали встречи</h2>
        
        <div class="details-grid">
          <div class="details-item">
            <div class="main-text">15 Ноября</div>
            <div class="sub-text">Воскресенье</div>
          </div>
          
          <div class="details-item">
            <div class="main-text">17:00</div>
            <div class="sub-text">Начало</div>
          </div>
          
          <div class="details-item">
            <div class="main-text">Светский Дом</div>
            <div class="sub-text">ул. Старателей, 38Б</div>
          </div>
        </div>

        <div class="dress-code">
          Дресс-код:
          <span>casual</span>
        </div>
      </div>

      <div class="card">
        <h3>Локация</h3>
        <div class="map-wrapper">
          <iframe
            src="https://yandex.ru/map-widget/v1/?ll=60.032432%2C56.913784&z=17&pt=60.032432,56.913784,pm2rdm"
            allowfullscreen=""
            loading="lazy"
            referrerpolicy="no-referrer-when-downgrade"
          ></iframe>
        </div>
        <div class="map-buttons">
          <a href="https://yandex.ru/maps/-/CXR3aHLy" target="_blank" class="btn">Открыть в Яндекс.Картах</a>
        </div>
      </div>

      <div class="card">
        <h2>Подтверждение</h2>
        <p style="text-align: center; font-size: 14px; color: var(--text-light); margin-bottom: 30px;">
          Пожалуйста, сообщите о своем присутствии
        </p>

        <form id="rsvpForm" action="https://formspree.io/f/mvgkzbqp" method="POST">
          <input type="hidden" name="_subject" value="RSVP на юбилей Константина" />
          <input type="hidden" name="_next" value="https://vangoshh.github.io/birthdayInvitation/?success=true" />

          <div class="form-group">
            <label for="name">Ваше имя</label>
            <input type="text" id="name" name="name" required placeholder="Имя и фамилия" />
          </div>

          <div class="form-group">
            <label>Вы придёте?</label>
            <div class="radio-options">
              <label class="radio-option">
                <input type="radio" name="attendance" value="yes" required />
                <span>Да, буду!</span>
              </label>
              <label class="radio-option">
                <input type="radio" name="attendance" value="no" />
                <span>К сожалению, не смогу</span>
              </label>
            </div>
          </div>

          <div class="form-group">
            <label for="guests">Количество гостей (включая вас)</label>
            <input type="number" id="guests" name="guests" min="1" max="10" value="1" />
          </div>

          <div class="form-group">
            <label for="message">Сообщение имениннику</label>
            <textarea id="message" name="message" rows="3" placeholder="Необязательно"></textarea>
          </div>

          <button type="submit">Отправить ответ</button>
        </form>

        <div id="successMessage" class="success-message" style="display: none; margin-top: 20px;">
          Спасибо! Ваш ответ отправлен.
        </div>
      </div>
      
    </div>
  </body>
</html>
